name: Build AMS Flagship Video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ams-flagship-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy edge-tts gTTS

      - name: Restore flagship builder
        shell: bash
        run: |
          cat > /tmp/ams_builder_bundle.b64 <<'B64'

B64
          base64 -d /tmp/ams_builder_bundle.b64 > /tmp/ams_builder_bundle.tgz
          tar -xzf /tmp/ams_builder_bundle.tgz -C .
          python -m py_compile tools/build_ams_flagship_video.py

      - name: Render flagship film
        env:
          AMS_FLAGSHIP_VOICE: en-US-JennyNeural
          AMS_FLAGSHIP_RATE: '-4%'
        run: python tools/build_ams_flagship_video.py

      - name: Verify output
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json AMS_Aspect_Marketing_Solutions_Flagship_33_Agents.mp4
          test -s AMS_Flagship_Captions.srt
          test -s AMS_Flagship_Script.txt
          test -s AMS_Flagship_Manifest.json

      - name: Upload flagship artifact
        uses: actions/upload-artifact@v4
        with:
          name: ams-flagship-33-agent-film
          compression-level: 0
          retention-days: 14
          path: |
            AMS_Aspect_Marketing_Solutions_Flagship_33_Agents.mp4
            AMS_Flagship_Captions.srt
            AMS_Flagship_Script.txt
            AMS_Flagship_Manifest.json
