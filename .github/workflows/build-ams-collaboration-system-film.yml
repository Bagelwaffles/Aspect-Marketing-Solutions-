name: Publish AMS Collaboration System Film

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ams-collaboration-system-film.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout media repository
        uses: actions/checkout@v4

      - name: Download verified render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/collaboration
          gh run download 32176660303 \
            --repo Bagelwaffles/Aspect-Marketing-Solutions- \
            --name ams-collaboration-system-film \
            --dir dist/collaboration

      - name: Verify downloaded media
        run: |
          test -s dist/collaboration/ams-collaboration-system-film.mp4
          test -s dist/collaboration/ams-collaboration-poster.webp
          test -s dist/collaboration/ams-collaboration-system-film.vtt
          test -s dist/collaboration/ams-collaboration-system-film-manifest.json
          ACTUAL_SHA=$(sha256sum dist/collaboration/ams-collaboration-system-film.mp4 | awk '{print $1}')
          EXPECTED_SHA=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('dist/collaboration/ams-collaboration-system-film-manifest.json').read_text())['sha256'])
          PY
          )
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='ams-collaboration-film-v1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/collaboration/* --clobber
          else
            gh release create "$TAG" dist/collaboration/* \
              --target "$GITHUB_SHA" \
              --title 'AMS Collaboration System Film v1' \
              --notes 'Verified AMS Collaboration System film. Build Together. Prove It. Scale It.'
          fi
