name: Build AMS Collaboration System Film

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ams-collaboration-system-film.yml'
  pull_request:
    branches: [main]
    paths:
      - 'render-trigger/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout media repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow edge-tts

      - name: Pull verified AMS collaboration renderer
        run: |
          mkdir -p scripts
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Bagelwaffles/aspect-ai-webview-app/main/scripts/build_ams_collaboration_film.py \
            --output scripts/build_ams_collaboration_film.py
          python -m py_compile scripts/build_ams_collaboration_film.py

      - name: Render film
        run: python scripts/build_ams_collaboration_film.py

      - name: Verify media
        run: |
          test -s dist/collaboration/ams-collaboration-system-film.mp4
          test -s dist/collaboration/ams-collaboration-poster.webp
          test -s dist/collaboration/ams-collaboration-system-film.vtt
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json dist/collaboration/ams-collaboration-system-film.mp4
          cat dist/collaboration/ams-collaboration-system-film-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ams-collaboration-system-film
          path: dist/collaboration/*
          retention-days: 30
          compression-level: 0

      - name: Publish stable release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='ams-collaboration-film-v1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/collaboration/* --clobber
          else
            gh release create "$TAG" dist/collaboration/* \
              --target "$GITHUB_SHA" \
              --title 'AMS Collaboration System Film v1' \
              --notes 'Cinematic AMS collaboration film: Build Together. Prove It. Scale It.'
          fi

      - name: Persist render proof
        if: github.event_name == 'push'
        run: |
          mkdir -p render-status
          cp dist/collaboration/ams-collaboration-system-film-manifest.json render-status/ams-collaboration-system-film-manifest.json
          cp dist/collaboration/ams-collaboration-system-film.vtt render-status/ams-collaboration-system-film.vtt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render-status/
          git commit -m 'chore: record verified AMS collaboration film [skip ci]' || exit 0
          git push origin HEAD:main
