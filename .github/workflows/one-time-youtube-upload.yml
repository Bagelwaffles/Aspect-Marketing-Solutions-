name: One-time AMS YouTube Upload

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-youtube-upload.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload Quick Marketing Audit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            'https://aspectmarketingsolutions.app.n8n.cloud/webhook/ams-inbound' <<'JSON'
          {
            "command": "upload",
            "arguments": {
              "videoUrl": "https://resource2.heygen.ai/aws_pacific/avatar_tmp/733dc9b89b20475496b4d86d0358ebcc/va6322c932e36406088ab186616cdd5a6/caption_636f6c315360413ead7b91b7a48378eb.mp4",
              "title": "Quick Marketing Audit for Small Businesses | $49 | #Shorts",
              "description": "Before you spend more on marketing, find out what actually needs fixing. The Aspect Marketing Solutions Quick Marketing Audit is $49 one time, with no subscription, and is delivered within 48 hours. You get 5 marketing problems, 5 specific fixes, a stronger headline, a stronger offer, one ready-to-use promotional post, and a practical 7-day action plan.\n\nGet started: https://www.aspectmarketingsolutions.app/quick-marketing-audit\n\n#SmallBusiness #Marketing #Shorts",
              "category": "People & Blogs",
              "privacyStatus": "public"
            }
          }
          JSON

      - name: Upload Cloud AI Command Center
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            'https://aspectmarketingsolutions.app.n8n.cloud/webhook/ams-inbound' <<'JSON'
          {
            "command": "upload",
            "arguments": {
              "videoUrl": "https://resource2.heygen.ai/aws_pacific/avatar_tmp/733dc9b89b20475496b4d86d0358ebcc/v46fa495c6eb34a99828f6f08d283f491/caption_41b1a2bba85b4ada834aa8eaef87ee21.mp4",
              "title": "Aspect Marketing Solutions: The Cloud AI Command Center",
              "description": "Meet Aspect Marketing Solutions (AMS), a cloud AI marketing and automation command center designed to bring specialized agents, workflows, publishing, analytics, billing, and business operations into one system.\n\nExplore AMS: https://www.aspectmarketingsolutions.app/\nQuick Marketing Audit: https://www.aspectmarketingsolutions.app/quick-marketing-audit\n\n#AI #MarketingAutomation #SmallBusiness",
              "category": "People & Blogs",
              "privacyStatus": "public"
            }
          }
          JSON
