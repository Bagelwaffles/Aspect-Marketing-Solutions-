name: Inspect AMS Flagship V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-ams-flagship-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_FILE: build-ams-flagship-video-v2.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record V2 render run
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=10")"
          run_id="$(printf '%s' "$run_json" | jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$run_id"
          status="$(printf '%s' "$run_json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id==$id) | .status')"
          conclusion="$(printf '%s' "$run_json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id==$id) | (.conclusion // "pending")')"
          cat > FLAGSHIP_V2_PROGRESS.md <<EOF
          # AMS Flagship V2 Render Progress

          Run ID: ${run_id}
          Status: ${status}
          Conclusion: ${conclusion}
          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLAGSHIP_V2_PROGRESS.md
          git commit -m 'docs: record flagship V2 render run' || true
          git push
